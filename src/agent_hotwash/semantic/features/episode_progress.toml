# Episode progress and claims — literal Nouls over digest facts (PLAN §6.3).

[[feature]]
id = "episode.progress.produces_requested_artifact"
scope = "episode"
primitive = "noul"
version = 2
requires = []
question = "Does any `episode.ops[].paths` match `task.deliverables` and get modified?"

[feature.criteria.true]
what = "An op path matches a task deliverable and that path is modified in this episode."
not_for = "Reads of a deliverable, or edits to unrelated files."
examples = [
  "The ledger deliverable is src/parser.py and the episode writes a patch to src/parser.py.",
  "The deliverable is docs/cli.md and the episode adds a section to docs/cli.md.",
]

[feature.criteria.false]
what = "No modified path matches a named deliverable, even if other files change."
not_for = "A path match that is only a search hit without modification."
examples = [
  "The agent edits tests/test_parser.py while the only deliverable is src/parser.py.",
  "The agent only reads src/parser.py and does not modify it.",
]

[[feature]]
id = "episode.progress.answers_explicit_question"
scope = "episode"
primitive = "noul"
version = 2
requires = []
question = "Does any `episode.messages[].text` state an answer to a question in `task.request`?"

[feature.criteria.true]
what = "An assistant message states an answer to a question that appears in the task request."
not_for = "Narration of next steps, or answering a question the user did not ask."
examples = [
  "The request asks where send_email is defined and the message says src/notify.py:80.",
  "The request asks whether tests pass and the message says pytest exited 0.",
]

[feature.criteria.false]
what = "Messages do not answer a question from the request; they narrate work or ask something else."
not_for = "A partial but explicit answer still counts if it addresses the asked question."
examples = [
  "The agent says I will look at the parser next, with no answer yet.",
  "The request was to add an endpoint and the message only restates the plan.",
]

[[feature]]
id = "episode.progress.novel_output"
scope = "episode"
primitive = "noul"
version = 2
requires = []
question = "Does any `episode.ops[].out_head` or `episode.ops[].out_tail` contain information not present in `episode.preceding`?"

[feature.criteria.true]
what = "Tool output in this episode contains information that does not appear in the preceding context."
not_for = "Reformatted copies of the same information already in preceding."
examples = [
  "A command prints a new traceback line that was not in preceding.last_message or last_ops.",
  "A file read returns a function body that was not in the preceding digest.",
]

[feature.criteria.false]
what = "Outputs only repeat information already present in preceding.last_message or last_ops."
not_for = "A new error code in otherwise similar output is still novel."
examples = [
  "The agent reruns ls and gets the same file list shown in the previous episode.",
  "The agent reprints a test failure identical to preceding.last_ops.",
]

[[feature]]
id = "episode.progress.action_references_prior_result"
scope = "episode"
primitive = "noul"
version = 2
requires = []
question = "Does the first op's target (path or command) appear in `episode.preceding.last_ops` or `episode.preceding.last_message`?"

[feature.criteria.true]
what = "The first op's path or command is something that appeared in the preceding last ops or last message."
not_for = "A later op that refers back after an unrelated first op."
examples = [
  "Preceding last_ops read src/a.py and this episode's first op edits src/a.py.",
  "The last message named pytest tests/test_a.py and this episode runs that command.",
]

[feature.criteria.false]
what = "The first op's target does not appear in the preceding last ops or last message."
not_for = "A path mentioned only in the user request, not in preceding, is not this feature."
examples = [
  "The agent starts by grepping a package that was not mentioned previously.",
  "The first op deploys a service never named in preceding.",
]

[[feature]]
id = "episode.progress.targets_named_component"
scope = "episode"
primitive = "noul"
version = 2
requires = []
question = "Does any op target a path or component named in `task.deliverables`?"
inspect = ["episode.ops", "task.deliverables"]

[feature.criteria.true]
what = "An op in this episode targets a path or component that appears in task.deliverables."
not_for = "Incidental string overlap that is not an op target."
examples = [
  "Deliverables include src/parser.py and the agent reads or edits src/parser.py.",
  "Deliverables include the billing package and the agent searches apps/billing/.",
]

[feature.criteria.false]
what = "No op targets a deliverable path or component; work stays elsewhere."
not_for = "A read of a deliverable still targets it even without a write."
examples = [
  "Deliverables list src/parser.py and the agent only edits docs/readme.md.",
  "The agent runs a repo-wide formatter with no deliverable path in the ops.",
]

[[feature]]
id = "episode.claim.declares_success"
scope = "episode"
primitive = "noul"
version = 2
requires = []
question = "Does any `episode.messages[].text` assert that the task or a step is complete?"

[feature.criteria.true]
what = "An assistant message asserts that the task or a named step is complete, fixed, or done."
not_for = "Hedged progress notes that do not claim the work is done."
examples = [
  "The message says the parser fix is complete and tests passed.",
  "The message says that should work now after the deploy.",
]

[feature.criteria.false]
what = "Messages do not claim completion; they report progress, plans, or uncertainty."
not_for = "A claim of completion still counts if a small caveat is attached."
examples = [
  "The message says still investigating the 500 and lists next reads.",
  "The message asks the user whether to continue with the worker change.",
]

[[feature]]
id = "episode.claim.cites_verification"
scope = "episode"
primitive = "noul"
version = 2
requires = []
question = "Does any `episode.messages[].text` cite a test or command result as evidence?"

[feature.criteria.true]
what = "An assistant message cites a test, command, or similar result as evidence for a claim."
not_for = "Vague should work claims, or citing a file edit rather than a result."
examples = [
  "The message says pytest tests/test_parser.py passed 12 tests.",
  "The message quotes curl /healthz -> 200 as evidence the endpoint works.",
]

[feature.criteria.false]
what = "Messages make claims without citing a test or command result."
not_for = "Citing an exit code or a passed count is verification even without a paste of the log."
examples = [
  "The message says the change should be fine with no command cited.",
  "The message restates the plan with no output quoted.",
]
