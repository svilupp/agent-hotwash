# Episode impediment kind — 6 environment kinds + none + other (PLAN §6.4).

[[feature]]
id = "episode.impediment.kind"
scope = "episode"
primitive = "choice"
version = 2
requires = []
question = "If the error tail is ambiguous, which environment impediment kind fits this episode?"
inspect = ["episode.ops", "episode.facts"]

[feature.criteria.sandbox_denied]
what = "The environment refused the op as a sandbox or policy denial."
not_for = "Ordinary product test failures, or a user interrupt."
examples = [
  "The output says the command was blocked by the sandbox.",
  "The tool returns a policy denial for writing outside the workspace.",
]

[feature.criteria.auth_failure]
what = "The op failed because credentials, tokens, or identity were rejected."
not_for = "Rate limits, network timeouts, or missing files."
examples = [
  "The CLI prints unauthorized when calling api.example.com.",
  "A 401 is returned when the agent uses an expired API token.",
]

[feature.criteria.rate_limit]
what = "The op failed because a rate limit or quota was hit."
not_for = "Permanent auth failures or generic network errors without a quota signal."
examples = [
  "The vendor API returns 429 Too Many Requests.",
  "The output says retry after 60s due to quota exceeded.",
]

[feature.criteria.network]
what = "The op failed due to connectivity, DNS, or TLS, not an application error."
not_for = "HTTP 4xx from a reachable server, or a missing local file."
examples = [
  "The command fails with connection refused to db.example.com:5432.",
  "curl exits with Could not resolve host api.example.com.",
]

[feature.criteria.timeout]
what = "The op was cut off because it exceeded a time limit."
not_for = "Fast failures with an application error, or a user abort."
examples = [
  "The tool output says the command timed out after 30s.",
  "A wait on a subagent expires with a timeout error.",
]

[feature.criteria.user_interrupt]
what = "The user aborted the op or turn, rather than the environment failing on its own."
not_for = "Sandbox denials, timeouts with no user cancel, or product test failures."
examples = [
  "The output says aborted by user after 977.8s.",
  "The turn is marked interrupted after the user cancelled.",
]

[feature.criteria.none]
what = "There is no environment impediment; errors are product, test, or absent."
not_for = "Any sandbox, auth, quota, network, timeout, or user-abort signal."
examples = [
  "pytest fails on an assertion in tests/test_parser.py.",
  "The episode has no error tail at all.",
]

[feature.criteria.other]
what = "An impediment is present but does not match the named kinds, or several kinds are mixed with none dominant."
not_for = "Clear matches to sandbox, auth, rate limit, network, timeout, user interrupt, or none."
examples = [
  "A missing system package that is not clearly a network or auth failure.",
  "A tool crash with a native abort that is not a timeout or user interrupt.",
]
