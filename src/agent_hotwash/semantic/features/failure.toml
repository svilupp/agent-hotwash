title = "agent-hotwash failed tool-result features"

[requires]
"task.request" = "string"
"task.explicit_stop_rules" = "array"
"repo.guidance_status" = "string"
"repo.guidance_excerpt" = "array"
"failure.command" = "string"
"failure.result" = "object"
"failure.result.error_text" = "string"
"failure.result.out_head" = "string"
"failure.result.out_tail" = "string"
"failure.shell" = "object"
"failure.shell.segments" = "array"
"context.prior_relevant_ops" = "array"
"context.after" = "array"

[data]
scope = "failure"

