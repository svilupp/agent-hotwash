[questions."failure.intent.presence_probe"]
type = "noul"
instructions.question = "Does `failure.command` inspect whether a named pattern or resource is present?"
instructions.inspect = ["`failure.command`"]
instructions.focus = "A read-only presence check is positive; opening a required file or running a build is negative."
[questions."failure.intent.presence_probe".criteria.true]
what = "The command performs a read-only grep, list, or existence check."
not_for = "Opening a required target or executing a project check."
examples = ["rg policy_tag models", "test -f optional.env"]
[questions."failure.intent.presence_probe".criteria.false]
what = "The command requires or executes the target rather than checking presence."
not_for = "A read-only query whose negative result is informative."
examples = ["cat required.env", "make test"]

[questions."failure.intent.absence_acceptable"]
type = "noul"
instructions.question = "Does `task.request` allow the target of `failure.command` to be absent as a valid answer to this check?"
instructions.compare = ["`task.request`", "`failure.command`"]
instructions.inspect = ["`task.request`", "`failure.command`"]
instructions.focus = "Judge whether a negative finding completes the requested check."
[questions."failure.intent.absence_acceptable".criteria.true]
what = "The task asks whether a target exists or appears, so absence is a valid answer."
not_for = "A task that requires using an exact named target."
examples = ["Check whether policy tags occur; grep finds none.", "See whether a branch matches AGI-6920; none does."]
[questions."failure.intent.absence_acceptable".criteria.false]
what = "The target must exist for the requested operation to complete."
not_for = "An exploratory check whose negative result is useful."
examples = ["Open issue DPA-2749; lookup fails.", "Run the service with required configuration; it is absent."]

[questions."failure.intent.stop_if_missing"]
type = "noul"
instructions.question = "Does `task.request` explicitly instruct the agent to stop if the prerequisite checked by `failure.command` is absent?"
instructions.compare = ["`task.request`", "`failure.command`"]
instructions.inspect = ["`task.explicit_stop_rules`", "`failure.command`"]
instructions.focus = "Require an explicit stop condition, not an inferred blocker."
[questions."failure.intent.stop_if_missing".criteria.true]
what = "The request explicitly says to stop when this prerequisite is absent."
not_for = "A request that merely asks to locate or create the target."
examples = ["Stop if .env is missing.", "If no deployment token exists, do not continue."]
[questions."failure.intent.stop_if_missing".criteria.false]
what = "The request provides no explicit instruction to stop on this absence."
not_for = "A literal stop-if-missing rule."
examples = ["Find or create .env.", "Try to locate the configuration."]

[questions."failure.intent.user_named_identifier"]
type = "noul"
instructions.question = "Does `task.request` give the exact identifier that this operation should use?"
instructions.compare = ["`task.request`", "`failure.command`"]
instructions.inspect = ["`task.request`"]
instructions.focus = "Look for an exact issue, branch, record, or resource identifier."
[questions."failure.intent.user_named_identifier".criteria.true]
what = "The request supplies the exact identifier required by the operation."
not_for = "A topic description with no literal identifier."
examples = ["Open DPA-2749.", "Inspect branch AGI-6920."]
[questions."failure.intent.user_named_identifier".criteria.false]
what = "The request describes a target without supplying an exact identifier."
not_for = "A literal identifier stated by the user."
examples = ["Find the privacy issue.", "Inspect the relevant feature branch."]

[questions."failure.intent.identifier_matches"]
type = "noul"
instructions.question = "Does `failure.command` use the exact identifier supplied in `task.request` for this operation?"
instructions.compare = ["`task.request`", "`failure.command`"]
instructions.inspect = ["`task.request`", "`failure.command`"]
instructions.focus = "Ask only when the request supplies an exact identifier; spelling and digits must match."
[questions."failure.intent.identifier_matches".criteria.true]
what = "The command uses the exact user-supplied identifier."
not_for = "A guessed neighbour or altered identifier."
examples = ["Request DPA-2749 and command uses DPA-2749.", "Request branch AGI-6920 and command uses AGI-6920."]
[questions."failure.intent.identifier_matches".criteria.false]
what = "The command changes, guesses, or substitutes the supplied identifier."
not_for = "An exact literal match."
examples = ["Request DPA-2749 but command uses DPA-2748.", "Request AGI-6920 but command searches AGI-6290."]

[questions."failure.intent.project_check"]
type = "noul"
instructions.question = "Does `failure.command` invoke a test, build, lint, type, or prompt-definition check declared by this repository?"
instructions.compare = ["`failure.command`", "`repo.guidance_excerpt`"]
instructions.inspect = ["`failure.command`", "`repo.guidance_excerpt`"]
instructions.focus = "Repository checks are positive; inline data inspection is negative."
[questions."failure.intent.project_check".criteria.true]
what = "The command invokes a repository-declared verification runner."
not_for = "An ad hoc inline analysis script."
examples = ["make lint prescribed by guidance.", "scripts/check_prompts.py declared by the repository."]
[questions."failure.intent.project_check".criteria.false]
what = "The command is an ad hoc inspection rather than a declared project check."
not_for = "A repository test, build, lint, type, or prompt checker."
examples = ["python -c reads JSON keys.", "A temporary SQL query inspects report data."]

[questions."failure.intent.agent_validator"]
type = "noul"
instructions.question = "Does `failure.command` run an inline or temporary script the agent wrote to inspect task data or output?"
instructions.inspect = ["`failure.command`", "`failure.result.error_text`"]
instructions.focus = "Distinguish an ad hoc validator from committed product or repository checks."
[questions."failure.intent.agent_validator".criteria.true]
what = "The agent runs temporary or inline validation logic over task data or output."
not_for = "A committed product or repository test runner."
examples = ["python -c loads generated JSON and indexes it.", "A heredoc executes an ad hoc SQL audit."]
[questions."failure.intent.agent_validator".criteria.false]
what = "The command runs committed product code or a repository-declared checker."
not_for = "Temporary inspection logic written for this task."
examples = ["make test", "python -m agent_hotwash"]

[questions."failure.intent.post_action_verifier"]
type = "noul"
instructions.question = "Does `failure.command` check the output of a separate command that ran earlier in `context.prior_relevant_ops`?"
instructions.compare = ["`failure.command`", "`context.prior_relevant_ops`"]
instructions.inspect = ["`failure.command`", "`context.prior_relevant_ops`"]
instructions.focus = "The failed command must verify an already-produced output, not perform the main action."
[questions."failure.intent.post_action_verifier".criteria.true]
what = "The command validates output produced by a separate earlier operation."
not_for = "The generator or primary action itself."
examples = ["Grep checks a previously generated HTML file.", "A query validates rows inserted by an earlier command."]
[questions."failure.intent.post_action_verifier".criteria.false]
what = "The command performs the main action or has no prior output to verify."
not_for = "A distinct follow-up check of completed output."
examples = ["The command generates the HTML.", "The build command itself fails."]

[questions."failure.intent.main_action_completed"]
type = "noul"
instructions.question = "Does `context.prior_relevant_ops` show that the requested artifact or main operation completed before this failed check?"
instructions.inspect = ["`task.request`", "`context.prior_relevant_ops`"]
instructions.focus = "Require evidence of main-action completion before the verifier failure."
[questions."failure.intent.main_action_completed".criteria.true]
what = "Prior operations show the requested main action or artifact completed."
not_for = "A build or generator that stopped before producing output."
examples = ["HTML write succeeded before grep failed.", "Migration creation succeeded before a schema verifier failed."]
[questions."failure.intent.main_action_completed".criteria.false]
what = "The main operation did not complete before this failure."
not_for = "A successful main action followed by a separate verifier."
examples = ["Compilation stopped before creating the binary.", "The generator itself returned an error."]

[questions."failure.context.recipe_documented"]
type = "noul"
instructions.question = "Does `repo.guidance_excerpt` explicitly prescribe the command or path form for the check attempted by `failure.command`?"
instructions.compare = ["`repo.guidance_excerpt`", "`failure.command`"]
instructions.inspect = ["`repo.guidance_status`", "`repo.guidance_excerpt`", "`failure.command`"]
instructions.focus = "Abstain when guidance was unavailable; require an explicit relevant recipe."
[questions."failure.context.recipe_documented".criteria.true]
what = "Observed repository guidance explicitly prescribes this command or path form."
not_for = "Generic guidance unrelated to this check."
examples = ["Guidance names make lint.", "Guidance shows the required Buf workspace path."]
[questions."failure.context.recipe_documented".criteria.false]
what = "Observed guidance contains no explicit recipe relevant to this attempted check."
not_for = "A literal command or path prescription."
examples = ["Guidance only describes architecture.", "Guidance names tests but no command form."]

[questions."failure.context.recipe_followed"]
type = "noul"
instructions.question = "Does `failure.command` follow the command or path form prescribed in `repo.guidance_excerpt`?"
instructions.compare = ["`failure.command`", "`repo.guidance_excerpt`"]
instructions.inspect = ["`failure.command`", "`repo.guidance_excerpt`"]
instructions.focus = "Ask only when a relevant recipe is documented."
[questions."failure.context.recipe_followed".criteria.true]
what = "The command follows the documented command and path form."
not_for = "An invocation against a different workspace or nested module."
examples = ["Guidance says make check and command runs make check.", "The documented Buf workspace path is used."]
[questions."failure.context.recipe_followed".criteria.false]
what = "The command departs from the documented recipe in a material way."
not_for = "An equivalent invocation using the prescribed form."
examples = ["Runs Buf against a nested module instead of workspace root.", "Runs pytest directly when guidance requires make test."]

[questions."failure.context.generated_only"]
type = "noul"
instructions.question = "Are all files named in `failure.result` as failed check targets documented generated artifacts in `repo.guidance_excerpt`?"
instructions.compare = ["`failure.result.error_text`", "`repo.guidance_excerpt`"]
instructions.inspect = ["`failure.result.error_text`", "`repo.guidance_excerpt`"]
instructions.focus = "Abstain without provenance for every named target."
[questions."failure.context.generated_only".criteria.true]
what = "Every failing target named in the result is documented as generated."
not_for = "A result that also identifies hand-edited source."
examples = ["Only a documented generated migration fails lint.", "All named protobuf outputs are documented generated files."]
[questions."failure.context.generated_only".criteria.false]
what = "At least one failing target is hand-edited or not documented as generated."
not_for = "A set consisting exclusively of documented generated artifacts."
examples = ["The result also names src/app.py.", "Guidance marks only one of two targets generated."]

[questions."failure.context.task_owned_code"]
type = "noul"
instructions.question = "Does `failure.result` identify code changed for this task as the failing target?"
instructions.inspect = ["`task.request`", "`failure.result.error_text`", "`context.prior_relevant_ops`"]
instructions.focus = "Require evidence linking the failing target to task changes."
[questions."failure.context.task_owned_code".criteria.true]
what = "The diagnostic identifies code changed as part of the current task."
not_for = "Only unrelated or generated boilerplate."
examples = ["Checker points at the callback edited earlier.", "Compiler names the newly added module."]
[questions."failure.context.task_owned_code".criteria.false]
what = "The diagnostic identifies only code not changed for this task."
not_for = "A failing target linked to current task edits."
examples = ["Only unrelated generated boilerplate fails.", "The target predates and is unrelated to the task."]

[questions."failure.context.agent_data_assumption"]
type = "noul"
instructions.question = "Does the failed agent-written validator access a key or index absent from the data shape shown in the result or prior output?"
instructions.inspect = ["`failure.command`", "`failure.result.error_text`", "`context.prior_relevant_ops`"]
instructions.focus = "Positive only for an agent-written validator with visible shape mismatch."
[questions."failure.context.agent_data_assumption".criteria.true]
what = "The validator assumes a key or index absent from the shown data shape."
not_for = "An exception raised by product code during normal execution."
examples = ["hr[0] is used on a dictionary.", "The script reads a missing report key."]
[questions."failure.context.agent_data_assumption".criteria.false]
what = "The evidence does not show an agent validator making a data-shape assumption."
not_for = "A visible missing key or invalid index in temporary validation logic."
examples = ["Product code raises during its normal run.", "The validator reads a key shown in prior output."]

[questions."failure.context.agent_sql_assumption"]
type = "noul"
instructions.question = "Does the failed agent-written query refer to a table or column absent from the schema shown in the output or prior inspection?"
instructions.inspect = ["`failure.command`", "`failure.result.error_text`", "`context.prior_relevant_ops`"]
instructions.focus = "Positive only for an ad hoc query and visible schema mismatch."
[questions."failure.context.agent_sql_assumption".criteria.true]
what = "The agent-written query references a table or column absent from the shown schema."
not_for = "A valid query that returns zero rows."
examples = ["Query uses l.guide_id and output says no such column.", "Temporary SQL names a table absent from schema inspection."]
[questions."failure.context.agent_sql_assumption".criteria.false]
what = "The evidence does not show a schema assumption in an agent-written query."
not_for = "A visible missing table or column in temporary SQL."
examples = ["A valid query returns no rows.", "Product migration SQL fails during normal execution."]

[questions."failure.check.invocation_rejected"]
type = "noul"
instructions.question = "Does `failure.result` say the tool rejected a flag, argument, workspace path, or configuration before the requested check began?"
instructions.inspect = ["`failure.result.error_text`", "`failure.command`"]
instructions.focus = "Invocation rejection is positive; a check that ran and found a violation is negative."
[questions."failure.check.invocation_rejected".criteria.true]
what = "The runner rejects invocation syntax or configuration before the check starts."
not_for = "A diagnostic emitted after the requested check ran."
examples = ["Buf rejects the module path.", "The CLI reports an unknown flag."]
[questions."failure.check.invocation_rejected".criteria.false]
what = "The runner starts and reports a check finding or product failure."
not_for = "A pre-run argument or configuration rejection."
examples = ["Buf reports a schema violation.", "Pytest reports a failed assertion."]

[questions."failure.check.test_assertion"]
type = "noul"
instructions.question = "Does `failure.result` identify a test case or assertion whose observed result differed from its expected result?"
instructions.inspect = ["`failure.result.error_text`", "`failure.result.out_head`", "`failure.result.out_tail`"]
instructions.focus = "Require a named assertion or expected-versus-observed result."
[questions."failure.check.test_assertion".criteria.true]
what = "The result identifies a test assertion with differing expected and observed values."
not_for = "A formatter diff or exit status without a test diagnostic."
examples = ["test_total expected 4 but got 3.", "AssertionError names the failed test case."]
[questions."failure.check.test_assertion".criteria.false]
what = "The result does not identify a test assertion mismatch."
not_for = "A named test with expected and observed values."
examples = ["Ruff prints a formatting diff.", "The process exits 1 without diagnostics."]

[questions."failure.check.format_finding"]
type = "noul"
instructions.question = "Does `failure.result` say a source file needs formatting changes?"
instructions.inspect = ["`failure.result.error_text`", "`failure.result.out_head`", "`failure.result.out_tail`"]
instructions.focus = "Formatting-only changes are positive; lint and tests are negative."
[questions."failure.check.format_finding".criteria.true]
what = "The result says source layout or formatting must change."
not_for = "A lint rule unrelated to formatting or a test assertion."
examples = ["Ruff says one file would be reformatted.", "Biome emits a format diff."]
[questions."failure.check.format_finding".criteria.false]
what = "The result does not report a formatting requirement."
not_for = "An explicit formatter finding."
examples = ["Ruff reports F401.", "Pytest reports AssertionError."]

[questions."failure.check.lint_finding"]
type = "noul"
instructions.question = "Does `failure.result` name a static lint rule violated by source or generated code?"
instructions.inspect = ["`failure.result.error_text`", "`failure.result.out_head`", "`failure.result.out_tail`"]
instructions.focus = "Require a named lint rule, not a formatter-only change."
[questions."failure.check.lint_finding".criteria.true]
what = "The result names a static lint rule violated by code."
not_for = "Formatting-only output or an invalid CLI flag."
examples = ["Ruff reports UP035.", "ESLint reports no-unused-vars."]
[questions."failure.check.lint_finding".criteria.false]
what = "The result does not identify a static lint-rule violation."
not_for = "A named lint code and target."
examples = ["A formatter says the file would change.", "The CLI rejects --bad-flag."]

[questions."failure.check.type_finding"]
type = "noul"
instructions.question = "Does `failure.result` name a static type-checking error in analyzed code?"
instructions.inspect = ["`failure.result.error_text`", "`failure.result.out_head`", "`failure.result.out_tail`"]
instructions.focus = "Static type diagnostics are positive; runtime validator exceptions are negative."
[questions."failure.check.type_finding".criteria.true]
what = "The result names a static type incompatibility in analyzed code."
not_for = "A runtime TypeError in an inline script."
examples = ["mypy reports incompatible return type.", "ty reports argument type mismatch."]
[questions."failure.check.type_finding".criteria.false]
what = "The result does not identify a static type-checking diagnostic."
not_for = "A named static type error."
examples = ["Inline Python raises TypeError at runtime.", "Pytest reports a value assertion."]

[questions."failure.check.prompt_finding"]
type = "noul"
instructions.question = "Does `failure.result` name a prompt-definition or question-bank rule violated by a prompt file?"
instructions.inspect = ["`failure.result.error_text`", "`failure.result.out_head`", "`failure.result.out_tail`"]
instructions.focus = "Require a prompt-definition checker rule, not a model answer or transport error."
[questions."failure.check.prompt_finding".criteria.true]
what = "The result names a prompt or question-bank validation rule."
not_for = "A model answer or API transport failure."
examples = ["check_prompts reports missing criteria examples.", "Question-bank validation reports an unguaranteed path."]
[questions."failure.check.prompt_finding".criteria.false]
what = "The result does not identify a prompt-definition rule violation."
not_for = "A named rule emitted by a prompt checker."
examples = ["JEV returns HTTP 503.", "A model classifies an example incorrectly."]

[questions."failure.check.product_compile"]
type = "noul"
instructions.question = "Does `failure.result` identify a compile or build error in task-owned product code after the runner started?"
instructions.inspect = ["`failure.result.error_text`", "`failure.command`", "`context.prior_relevant_ops`"]
instructions.focus = "A compiler diagnostic after startup is positive; rejected invocation is negative."
[questions."failure.check.product_compile".criteria.true]
what = "The started build reports a compiler diagnostic in task-owned product code."
not_for = "A workspace path rejected before compilation."
examples = ["tsc reports an error in the edited module.", "The compiler rejects syntax in newly added code."]
[questions."failure.check.product_compile".criteria.false]
what = "The evidence does not show a compiler error after the runner started."
not_for = "A concrete compiler diagnostic in changed code."
examples = ["Buf rejects a path before work begins.", "A formatter reports layout changes."]

[questions."failure.check.product_runtime"]
type = "noul"
instructions.question = "Does `failure.result` identify an exception raised by the product during its normal run path?"
instructions.inspect = ["`failure.result.error_text`", "`failure.command`", "`context.prior_relevant_ops`"]
instructions.focus = "Product normal-run exceptions are positive; agent-written validator exceptions are negative."
[questions."failure.check.product_runtime".criteria.true]
what = "The invoked product raises an exception during its normal execution path."
not_for = "An ad hoc inline analysis script."
examples = ["The application stack trace comes from its normal entrypoint.", "A service process panics handling the requested run."]
[questions."failure.check.product_runtime".criteria.false]
what = "The exception does not arise from the product's normal run path."
not_for = "A product process stack trace."
examples = ["Inline analysis raises KeyError.", "A temporary SQL validator names a missing column."]

[questions."failure.recovery.corrected_argument"]
type = "noul"
instructions.question = "Does the next attempt change the specific flag, path, or selector rejected or disproved by `failure.result`?"
instructions.compare = ["`failure.result.error_text`", "`context.after`"]
instructions.inspect = ["`failure.result.error_text`", "`context.after`"]
instructions.focus = "Require a targeted correction in the next attempt."
[questions."failure.recovery.corrected_argument".criteria.true]
what = "The next attempt changes the particular rejected or disproved argument."
not_for = "An unrelated guessed flag or unchanged retry."
examples = ["The next Buf command corrects --path.", "The next HTML check uses the corrected selector."]
[questions."failure.recovery.corrected_argument".criteria.false]
what = "The next attempt does not correct the specific rejected argument."
not_for = "A targeted change supported by the failure diagnostic."
examples = ["The same command is repeated.", "A different unrelated flag is guessed."]

[questions."failure.recovery.repeated_without_evidence"]
type = "noul"
instructions.question = "Does `context.after` repeat the failed operation before any new diagnostic, source change, configuration change, or credential change appears?"
instructions.inspect = ["`failure.command`", "`failure.result.error_text`", "`context.after`"]
instructions.focus = "An unchanged retry without new evidence is positive."
[questions."failure.recovery.repeated_without_evidence".criteria.true]
what = "The operation is retried before any relevant evidence or state change."
not_for = "A retry after inspecting schema, editing source, or changing credentials."
examples = ["The same helper is rerun immediately.", "The denied API call is repeated without access changes."]
[questions."failure.recovery.repeated_without_evidence".criteria.false]
what = "New evidence or a relevant state change precedes the next attempt."
not_for = "An unchanged evidence-free retry."
examples = ["Schema inspection precedes a revised query.", "Source is edited before tests rerun."]

[questions."failure.recovery.stopped_on_access_block"]
type = "noul"
instructions.question = "After the access denial in `failure.result`, does `context.after` stop attempts to access that service until new credentials or permission appear?"
instructions.compare = ["`failure.result.error_text`", "`context.after`"]
instructions.inspect = ["`failure.result.error_text`", "`context.after`"]
instructions.focus = "Stopping and reporting the access blocker is positive; credential hunting is negative."
[questions."failure.recovery.stopped_on_access_block".criteria.true]
what = "Service access attempts stop until authorization changes or the blocker is reported."
not_for = "Searching locally for alternative secrets or repeating denied calls."
examples = ["The agent reports the missing IAM permission and stops.", "It waits for credential refresh before another request."]
[questions."failure.recovery.stopped_on_access_block".criteria.false]
what = "The agent continues unauthorized access attempts without new authorization."
not_for = "A bounded stop pending credentials or permission."
examples = ["It searches home directories for service-account keys.", "It repeats the denied call unchanged."]

[questions."failure.recovery.passed_without_product_edit"]
type = "noul"
instructions.question = "Does a later equivalent check pass after changing only invocation, formatting, or verifier logic, with no product behavior edit?"
instructions.inspect = ["`failure.command`", "`failure.result.error_text`", "`context.after`"]
instructions.focus = "Positive only when an equivalent check passes without a product-behavior edit."
[questions."failure.recovery.passed_without_product_edit".criteria.true]
what = "An equivalent later check passes after only invocation, formatting, or verifier changes."
not_for = "A pass that follows a product behavior repair."
examples = ["Corrected Buf path passes with no source edit.", "Fixed HTML selector verifies the already-produced artifact."]
[questions."failure.recovery.passed_without_product_edit".criteria.false]
what = "No equivalent pass is shown, or product behavior changed before the pass."
not_for = "A non-product correction followed by equivalent success."
examples = ["Product code is repaired before tests pass.", "There is no later successful check."]

