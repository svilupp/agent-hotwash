[questions."task.decomposition.multiple_deliverables"]
type = "noul"
instructions.question = "Does `task.request` name more than one required deliverable?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.decomposition.multiple_deliverables".criteria.true]
what = "The request names two or more distinct required outputs (files, features, or artefacts)."
not_for = "A single deliverable described with extra files as context only."
examples = [
  "The user asks to add src/a.py and also write docs/a.md.",
  "The user asks for a fix in the API and a matching change in the worker.",
]

[questions."task.decomposition.multiple_deliverables".criteria.false]
what = "The request names a single deliverable, or extra mentions are only context."
not_for = "Two named required outputs count even if they live in one sentence."
examples = [
  "The user asks to fix src/parser.py and happens to mention the README as background.",
  "The user asks only to run make test.",
]

[questions."task.decomposition.explicit_ordering"]
type = "noul"
instructions.question = "Does `task.request` say that one named deliverable must precede another?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.decomposition.explicit_ordering".criteria.true]
what = "The request states that one named deliverable must be done before another."
not_for = "Implied engineering order that the user never states."
examples = [
  "The user says first write the failing test, then change src/parser.py until it passes.",
  "The user says migrate the schema before deploying the worker that reads the new column.",
]

[questions."task.decomposition.explicit_ordering".criteria.false]
what = "The request lists several items without saying that one must precede another."
not_for = "Words like first/then/before between named deliverables are explicit ordering."
examples = [
  "The user asks to update the API and the worker, with no order given.",
  "The user asks to fix a single function in src/a.py.",
]

[questions."task.decomposition.explicit_dependency"]
type = "noul"
instructions.question = "Does `task.request` say that a deliverable needs another deliverable's output?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.decomposition.explicit_dependency".criteria.true]
what = "The request states that one deliverable needs the output of another (not merely that it comes later)."
not_for = "Ordering without using the earlier output, or unstated technical coupling."
examples = [
  "The user says the worker change needs the new proto field from the API change.",
  "The user says the docs page should quote the CLI help text produced by the new flag.",
]

[questions."task.decomposition.explicit_dependency".criteria.false]
what = "The request does not say that one deliverable's output is an input to another."
not_for = "Needs/depends on/using the output of are explicit dependency."
examples = [
  "The user lists two independent files to edit.",
  "The user says do A then B only as a time order, without using B's output.",
]

[questions."task.decomposition.named_shared_artifacts"]
type = "noul"
instructions.question = "Does `task.request` name an artifact that more than one deliverable must share or both touch?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.decomposition.named_shared_artifacts".criteria.true]
what = "The request names a shared artifact (path, schema, or API) that more than one deliverable must use or both change."
not_for = "Unstated coupling the user never names."
examples = [
  "The user says both the API and the worker must use proto/billing.proto.",
  "The user says the web app and the PDF renderer share templates/invoice.html.",
]

[questions."task.decomposition.named_shared_artifacts".criteria.false]
what = "The request does not name an artifact shared across deliverables."
not_for = "A named shared path or schema counts even if only one side is edited in this session."
examples = [
  "The user asks to edit src/a.py only.",
  "The user asks for two features in unrelated packages with no shared file named.",
]

[questions."task.decomposition.explicit_independence"]
type = "noul"
instructions.question = "Does `task.request` state that listed deliverables can be done independently?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.decomposition.explicit_independence".criteria.true]
what = "The request states that the listed deliverables are independent or can proceed in parallel."
not_for = "Silence about coupling, which is not an independence claim."
examples = [
  "The user says the docs update and the parser fix can happen independently.",
  "The user says the two bugfixes are unrelated and may be split across agents.",
]

[questions."task.decomposition.explicit_independence".criteria.false]
what = "The request does not claim independence; items may be listed without that claim."
not_for = "Words like independently, in parallel, or unrelated between named items count."
examples = [
  "The user lists two files to change with no comment on coupling.",
  "The user asks for a single deliverable.",
]

[questions."task.intent.inquire"]
type = "noul"
instructions.question = "Does `task.request` ask for knowledge as the required output (a location, explanation, investigation, or cause), not a review judgment or a mutation?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.inquire".criteria.true]
what = "The required output is knowledge: locating something, explaining it, investigating it, or establishing a cause."
not_for = "Reviews, audits, or other judgments of existing work (those are assess). Mutations whose investigation is only a means to a patch."
examples = [
  "The user asks why no emails were sent today and wants the cause identified.",
  "The user asks where the rate limiter lives and wants a path, not a patch.",
]

[questions."task.intent.inquire".criteria.false]
what = "The required output is not knowledge; the user asks to change, assess, run, or write something else."
not_for = "A request that both investigates and then changes still counts as inquire if knowledge is required."
examples = [
  "The user asks to add a health-check endpoint to src/server.py.",
  "The user asks to deploy the current main branch to staging.example.com.",
]

[questions."task.intent.change"]
type = "noul"
instructions.question = "Does `task.request` require a mutation of artifacts (add, fix, refactor, migrate, configure, or remove)?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.change".criteria.true]
what = "The required output is a persistent change to code, config, data, or other artifacts."
not_for = "Inspection or recommendations that do not ask for a mutation."
examples = [
  "The user asks to fix the nil pointer in src/parser.py and land the patch.",
  "The user asks to add an admin user screen under apps/web/admin/.",
]

[questions."task.intent.change".criteria.false]
what = "The request asks for inspection, explanation, or recommendations without a requested mutation."
not_for = "A request that mentions a bug but already asks for the fix is still a change."
examples = [
  "The user asks why the flaky test fails on CI and does not ask for a fix.",
  "The user asks for a review of the pull request with comments only.",
]

[questions."task.intent.assess"]
type = "noul"
instructions.question = "Does `task.request` ask for a judgment of existing work (verify, review, audit, compare, or measure) as the required output?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.assess".criteria.true]
what = "The required output is a judgment of existing work: verify, review, audit, compare, or measure."
not_for = "Implement, add, or fix requests, even if the agent will inspect files first. Open-ended causal investigation whose output is a cause, not a judgment."
examples = [
  "The user asks whether the migration is safe to run against staging.",
  "The user asks to compare the two cache implementations and recommend one.",
]

[questions."task.intent.assess".criteria.false]
what = "The request is an open-ended causal investigation, or it asks to build or run something rather than judge it."
not_for = "A request to review a diff is assess even if a later fix might follow."
examples = [
  "The user asks why checkout fails for some customers, wanting a root cause.",
  "The user asks to implement the cache the design doc describes.",
]

[questions."task.intent.execute"]
type = "noul"
instructions.question = "Does `task.request` ask to run, deploy, build, or operate an already-existing procedure as a required output?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.execute".criteria.true]
what = "The required output is running an existing procedure such as a named deploy, test run, build, or operational command."
not_for = "Implementing, adding, reviewing, or refactoring code, even if tests or commands will be run along the way."
examples = [
  "The user asks to deploy the current main branch using the existing playbook.",
  "The user asks to run the nightly backup script as documented in runbooks/backup.md.",
]

[questions."task.intent.execute".criteria.false]
what = "The request is to create a procedure or change an implementation; any later test run is incidental."
not_for = "A request that names deploy or run as a required output is execute even if a fix is also named."
examples = [
  "The user asks to add an admin user in two apps.",
  "The user asks to implement a UI alignment change in the admin preview.",
]

[questions."task.intent.communicate"]
type = "noul"
instructions.question = "Does `task.request` ask for documentation, a summary, or a handoff write-up as the named deliverable?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.communicate".criteria.true]
what = "The required output is human-facing documentation, a summary, or a handoff write-up named as the deliverable."
not_for = "A review or audit whose vehicle is a message (that is assess). Patch notes or a PR body incidental to a code change."
examples = [
  "The user asks to write a README for the billing package at docs/billing.md.",
  "The user asks for a handoff note summarising what the agent changed this session.",
]

[questions."task.intent.communicate".criteria.false]
what = "Communication is only incidental to another deliverable such as a patch or a command run."
not_for = "A standalone request to document an API is communicate even if files are edited."
examples = [
  "The user asks to fix the parser and also to mention the change in the PR body.",
  "The user asks to deploy staging and ping the channel when it is done.",
]

[questions."task.intent.locate"]
type = "noul"
instructions.question = "Does `task.request` ask to find a path, symbol, or location rather than explain or fix it?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.locate".criteria.true]
what = "The request asks to find where something lives: a file, symbol, config key, or call site."
not_for = "Requests that already name the location and ask what it does or to change it."
examples = [
  "The user asks which module registers the /health route.",
  "The user asks where the Stripe webhook secret is read from.",
]

[questions."task.intent.locate".criteria.false]
what = "The request asks to explain behaviour, establish a cause, or change the code rather than merely locate it."
not_for = "A locate request may mention a symptom if the asked output is still a location."
examples = [
  "The user asks why the /health route returns 500.",
  "The user asks to move the /health route to a new package.",
]

[questions."task.intent.explain"]
type = "noul"
instructions.question = "Does `task.request` ask for an explanation of how something works without requiring a cause or a change?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.explain".criteria.true]
what = "The request asks how existing behaviour, code, or a system works, as an explanation."
not_for = "Causal investigation (why/what broke) or a requested mutation."
examples = [
  "The user asks how the retry loop in src/client.py decides backoff.",
  "The user asks what the billing invoice template does with tax fields.",
]

[questions."task.intent.explain".criteria.false]
what = "The request asks why something failed, where something lives, or to change it."
not_for = "An explain request may mention a file path if the output is still an explanation."
examples = [
  "The user asks why invoices doubled tax for EU customers.",
  "The user asks to rewrite the retry loop to cap at three attempts.",
]

[questions."task.intent.investigate"]
type = "noul"
instructions.question = "Does `task.request` ask to gather evidence about behaviour without requiring a named cause to be proven?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.investigate".criteria.true]
what = "The request asks to gather evidence about behaviour, a discrepancy, or a failure, without already naming the cause."
not_for = "Requests that already name the cause and skip evidence-gathering, or that only ask for a location."
examples = [
  "The user asks to look into reports that search results are empty after deploy.",
  "The user asks to collect logs around the 15:00 timeout on worker-3.",
]

[questions."task.intent.investigate".criteria.false]
what = "The request already names the cause, only asks to locate a symbol, or asks for a patch with no investigation."
not_for = "Investigate still applies when the user wants evidence even if a later fix is likely."
examples = [
  "The user says the nil pointer in src/a.py is the cause and asks to fix it.",
  "The user asks which file defines SearchClient.",
]

[questions."task.intent.root_cause"]
type = "noul"
instructions.question = "Does `task.request` use explicit causal language (why, cause, what broke) to require establishing a cause?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.root_cause".criteria.true]
what = "The request uses explicit causal language such as why, cause, or what broke, and requires a cause to be established."
not_for = "Requests that mention a bug but already name the cause and ask for the fix."
examples = [
  "The user asks why there were no emails sent today from notify@example.com.",
  "The user asks what caused the test to flake on CI after the cache change.",
]

[questions."task.intent.root_cause".criteria.false]
what = "The request describes a symptom or asks for a fix without explicit causal language."
not_for = "A why question about behaviour is root_cause even if a patch might follow."
examples = [
  "The user asks to fix the flaky test in tests/test_cache.py.",
  "The user asks to add retries around the mail sender.",
]

[questions."task.intent.add"]
type = "noul"
instructions.question = "Does `task.request` ask to add a new artifact, feature, or behaviour that is not present yet?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.add".criteria.true]
what = "The request asks to create something new: a file, feature, endpoint, test, or config that does not exist yet."
not_for = "Fixes or refactors of existing behaviour described as if they were new work."
examples = [
  "The user asks to add a /readyz endpoint next to /healthz.",
  "The user asks to add an admin user martin@example.com in the seed data.",
]

[questions."task.intent.add".criteria.false]
what = "The request asks to fix, refactor, migrate, configure, or remove existing artefacts rather than add new ones."
not_for = "Adding tests for existing code still counts as add."
examples = [
  "The user asks to fix the existing /healthz handler that 500s.",
  "The user asks to delete the unused seed file.",
]

[questions."task.intent.fix"]
type = "noul"
instructions.question = "Does `task.request` ask to correct broken or incorrect existing behaviour?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.fix".criteria.true]
what = "The request asks to correct existing behaviour that is broken, incorrect, or failing."
not_for = "Refactors or features that are not framed as correcting a defect."
examples = [
  "The user asks to fix the 500 on POST /invoices for EU VAT.",
  "The user says the login form rejects valid emails such as user@example.com.",
]

[questions."task.intent.fix".criteria.false]
what = "The request asks to add new behaviour, refactor working code, or run a procedure, not to correct a defect."
not_for = "A fix request may also ask for tests; it is still fix if the primary output is a correction."
examples = [
  "The user asks to add a new billing export CSV.",
  "The user asks to rename helpers for clarity in a passing module.",
]

[questions."task.intent.refactor"]
type = "noul"
instructions.question = "Does `task.request` ask to restructure existing code without changing its required behaviour?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.refactor".criteria.true]
what = "The request asks to restructure, rename, or clean up existing code while keeping required behaviour the same."
not_for = "Behaviour changes or defect fixes described with the word refactor."
examples = [
  "The user asks to split src/parser.py into a package without changing outputs.",
  "The user asks to rename getUser to get_user across the billing service.",
]

[questions."task.intent.refactor".criteria.false]
what = "The request asks to change behaviour, fix a defect, or add a feature, not merely restructure."
not_for = "A rename that is required for a behaviour change is not a standalone refactor."
examples = [
  "The user asks to make the parser accept trailing commas, which is new behaviour.",
  "The user asks to fix the off-by-one in the parser tests.",
]

[questions."task.intent.migrate_or_configure"]
type = "noul"
instructions.question = "Does `task.request` ask to migrate data/config or to change configuration of an existing system?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.migrate_or_configure".criteria.true]
what = "The request asks to migrate data or configuration, or to change settings of an existing system."
not_for = "Ordinary feature work or deploys that do not change config or migrate data."
examples = [
  "The user asks to migrate the sessions table to the new schema on staging.",
  "The user asks to set the cache TTL to 60s in config/defaults.toml.",
]

[questions."task.intent.migrate_or_configure".criteria.false]
what = "The request asks to add a feature, fix a defect, or run a deploy without migrating or reconfiguring."
not_for = "A config change that also requires a small code edit is still migrate_or_configure."
examples = [
  "The user asks to add a new cache key for the search results.",
  "The user asks to deploy the already-configured service to production.",
]

[questions."task.intent.remove"]
type = "noul"
instructions.question = "Does `task.request` ask to delete, drop, or otherwise remove an artifact or behaviour?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.remove".criteria.true]
what = "The request asks to delete files, drop data, or remove behaviour that currently exists."
not_for = "Replacements that keep a successor in the same place."
examples = [
  "The user asks to remove the unused FeatureFlag helper and its tests.",
  "The user asks to drop the legacy events_old table after the backfill.",
]

[questions."task.intent.remove".criteria.false]
what = "The request asks to add, fix, or refactor without deleting the named artifact."
not_for = "A remove request may include a follow-up cleanup of imports; it is still remove."
examples = [
  "The user asks to replace the helper with a new implementation, keeping the module.",
  "The user asks to archive the table by renaming it, not dropping it.",
]

[questions."task.intent.verify"]
type = "noul"
instructions.question = "Does `task.request` ask to check whether a stated result or invariant holds?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.verify".criteria.true]
what = "The request asks to check whether a stated result, test, or invariant holds."
not_for = "Open-ended reviews or comparisons without a stated invariant to check."
examples = [
  "The user asks to verify that pytest still passes after the cache change.",
  "The user asks to confirm the /healthz endpoint returns 200 on staging.example.com.",
]

[questions."task.intent.verify".criteria.false]
what = "The request asks for a qualitative review, a comparison, or an investigation rather than a yes/no check."
not_for = "Verify still applies when the user names a command that should pass."
examples = [
  "The user asks for a code review of the cache change.",
  "The user asks which of two caches is faster.",
]

[questions."task.intent.review"]
type = "noul"
instructions.question = "Does `task.request` ask for a qualitative review or audit of existing work?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.review".criteria.true]
what = "The request asks for a qualitative review, audit, or critique of existing work."
not_for = "Pass/fail verification or a request to implement the findings."
examples = [
  "The user asks to review the pull request for security issues in auth.",
  "The user asks for an audit of how secrets are loaded in apps/api/.",
]

[questions."task.intent.review".criteria.false]
what = "The request asks for a binary verification, a comparison of options, or a code change."
not_for = "A review may mention files to change later; it is still review if the asked output is judgment."
examples = [
  "The user asks to check that make test exits 0.",
  "The user asks to compare Redis vs in-memory cache and pick one.",
]

[questions."task.intent.compare"]
type = "noul"
instructions.question = "Does `task.request` ask to compare two or more existing options, implementations, or results?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.compare".criteria.true]
what = "The request asks to compare two or more named options, implementations, or results."
not_for = "Single-item reviews or implementation of an already-chosen option."
examples = [
  "The user asks to compare the Python and Go parsers on the same fixture.",
  "The user asks which of the two rate-limit designs in the doc is cheaper.",
]

[questions."task.intent.compare".criteria.false]
what = "The request judges a single artefact, verifies a pass/fail, or asks to implement one option."
not_for = "Compare still applies when more than two options are listed."
examples = [
  "The user asks to review src/parser.py on its own.",
  "The user asks to implement the token-bucket design from the doc.",
]

[questions."task.intent.run"]
type = "noul"
instructions.question = "Does `task.request` ask to run an existing command, test, or job without deploying?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.run".criteria.true]
what = "The request asks to run an existing command, test suite, or job, not to deploy it."
not_for = "Deploys to an environment, or authoring the procedure itself."
examples = [
  "The user asks to run make test and paste the failures.",
  "The user asks to kick off the nightly ETL job in the existing scheduler.",
]

[questions."task.intent.run".criteria.false]
what = "The request asks to deploy to an environment, or to write/change the command being run."
not_for = "Running tests that already exist is run even if the user also wants a summary."
examples = [
  "The user asks to deploy the API to production.example.com.",
  "The user asks to rewrite the Makefile test target.",
]

[questions."task.intent.deploy"]
type = "noul"
instructions.question = "Does `task.request` ask to deploy or release to an environment using an existing procedure?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.intent.deploy".criteria.true]
what = "The request asks to deploy or release an existing build to an environment."
not_for = "Local runs, or creating the deploy procedure rather than using it."
examples = [
  "The user asks to deploy main to staging.example.com with the existing workflow.",
  "The user asks to roll out the worker image to production using the playbook.",
]

[questions."task.intent.deploy".criteria.false]
what = "The request asks only to run local tests or to write a new deploy path."
not_for = "A deploy request may include a smoke check; it is still deploy if the required output is the release."
examples = [
  "The user asks to run the unit tests locally.",
  "The user asks to create a new GitHub Actions deploy workflow from scratch.",
]

[questions."task.scope.breadth"]
type = "score"
instructions.question = "How many named or clearly implied targets in `task.request` and `task.deliverables` must change together?"
instructions.inspect = [
  "`task.request`",
  "`task.deliverables`",
]
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[[questions."task.scope.breadth".criteria]]
name = "localized"
what = "One file or function is named or clearly implied as the only place that must change."
not_for = "Requests that name a package, several services, or repo-wide conventions."
examples = [
  "The user asks to fix the off-by-one in parse_date inside src/dates.py.",
  "The user asks to rename helper format_vat in billing/tax.py only.",
]

[[questions."task.scope.breadth".criteria]]
name = "subsystem"
what = "One package or service must change, spanning more than a single file or function."
not_for = "A single-function fix, or work that names two or more services together. A whole-app review that does not name two services stays subsystem."
examples = [
  "The user asks to add retries across the billing client package.",
  "The user asks to document every public function in apps/search/.",
]

[[questions."task.scope.breadth".criteria]]
name = "cross_subsystem"
what = "Two or more packages or services are named and must change together for the request to be done."
not_for = "Work confined to one package. A whole-application review that does not name two services."
examples = [
  "The user asks to add a field that the API, worker, and invoice template must all understand.",
  "The user asks to rename a proto field used by both apps/api and apps/web.",
]

[[questions."task.scope.breadth".criteria]]
name = "system_wide"
what = "The request targets build, infra, or repo-wide conventions rather than a product subsystem."
not_for = "Product changes that happen to touch many files but stay inside one domain."
examples = [
  "The user asks to switch the repo to ruff format and fail CI on diffs.",
  "The user asks to bump the base Docker image used by every service.",
]

[questions."task.uncertainty.requirements"]
type = "noul"
instructions.question = "Does `task.request` leave what done means unstated?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.uncertainty.requirements".criteria.true]
what = "The request does not state acceptance criteria, a test, or a concrete done condition."
not_for = "Requests that name a file to change but still define a check for done."
examples = [
  "The user says improve the search experience with no metric or example.",
  "The user says make billing less confusing without naming a screen or copy.",
]

[questions."task.uncertainty.requirements".criteria.false]
what = "The request states a check, artefact, or behaviour that would count as done."
not_for = "A vague adjective with a named test still has stated done criteria."
examples = [
  "The user asks to add a test that pytest tests/test_search.py passes.",
  "The user asks for a /readyz endpoint that returns 200 with status ok.",
]

[questions."task.uncertainty.cause"]
type = "noul"
instructions.question = "Does `task.request` describe a symptom without a named cause?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.uncertainty.cause".criteria.true]
what = "The request describes a symptom, failure, or discrepancy and does not name a cause."
not_for = "Requests that already name the defective function, config, or dependency as the cause."
examples = [
  "The user says checkout fails for some EU customers and does not say why.",
  "The user says CI is red on main with no failing test named as the cause.",
]

[questions."task.uncertainty.cause".criteria.false]
what = "The request names the cause, or does not describe a symptom at all."
not_for = "A symptom plus a guessed cause still has a named cause if the guess is stated as fact."
examples = [
  "The user says the nil pointer in src/pay.py is the cause and asks to fix it.",
  "The user asks to add a dark-mode toggle with no failure mentioned.",
]

[questions."task.uncertainty.solution"]
type = "noul"
instructions.question = "Does `task.request` name a goal but no approach, when the goal admits several approaches?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.uncertainty.solution".criteria.true]
what = "The request names a goal, does not name an approach, and more than one approach could satisfy it."
not_for = "Prescribed mechanical actions, or goals that name the method to use."
examples = [
  "The user asks to make search faster without saying cache, index, or algorithm.",
  "The user asks to stop duplicate emails without specifying a lock, idempotency key, or dedupe table.",
]

[questions."task.uncertainty.solution".criteria.false]
what = "The request names the approach, or the goal only admits one mechanical action."
not_for = "A goal with several methods still has solution uncertainty even if a file is named."
examples = [
  "The user asks to add an idempotency key on the send_email call.",
  "The user asks to rename getUser to get_user in src/users.py.",
]

[questions."task.uncertainty.external"]
type = "noul"
instructions.question = "Does `task.request` depend on information outside the repo such as API docs, vendor behaviour, or prod data?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.uncertainty.external".criteria.true]
what = "The request depends on information that is not in the repo: vendor APIs, production data, or third-party docs."
not_for = "Ordinary work that only happens to mention a vendor name already wrapped in-repo."
examples = [
  "The user asks why Stripe billed twice and the logs are only in the vendor dashboard.",
  "The user asks to match production.example.com behaviour that is not reproduced in fixtures.",
]

[questions."task.uncertainty.external".criteria.false]
what = "The request can be answered from in-repo code, tests, and docs alone."
not_for = "External still applies when the user points at a public API doc URL."
examples = [
  "The user asks to fix a unit test that already fails locally on the fixture.",
  "The user asks to document a function whose behaviour is fully in src/parser.py.",
]

[questions."task.risk.production"]
type = "noul"
instructions.question = "Does `task.request` name deploying, migrating, or touching production or live systems?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.risk.production".criteria.true]
what = "The request names production, live systems, or a real deploy/migration to those systems."
not_for = "Local or staging-only work, even if production is mentioned as future context."
examples = [
  "The user asks to deploy the worker to production.example.com.",
  "The user asks to run the sessions migration against the live database.",
]

[questions."task.risk.production".criteria.false]
what = "The request is limited to local, staging, or hypothetical environments and does not name production."
not_for = "A staging deploy is not production unless live/prod is named."
examples = [
  "The user asks to run the migration against the local docker compose database.",
  "The user asks to add a dry-run flag without executing it on live.",
]

[questions."task.risk.data_loss"]
type = "noul"
instructions.question = "Does `task.request` name deleting, dropping, or rewriting persisted data?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.risk.data_loss".criteria.true]
what = "The request names deleting, dropping, truncating, or rewriting persisted data."
not_for = "Code deletions, or additive migrations that do not drop data."
examples = [
  "The user asks to drop the events_old table after the backfill.",
  "The user asks to rewrite the customers table to strip stale emails.",
]

[questions."task.risk.data_loss".criteria.false]
what = "The request changes code or config without deleting or rewriting persisted data."
not_for = "A destructive SQL statement in the request is data_loss even if wrapped in a transaction."
examples = [
  "The user asks to add a column and backfill it, keeping existing rows.",
  "The user asks to delete a unused Python helper, not a database table.",
]

[questions."task.risk.security"]
type = "noul"
instructions.question = "Does `task.request` name auth, permissions, secrets, or user identity?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.risk.security".criteria.true]
what = "The request names authentication, permissions, secrets, tokens, or user identity."
not_for = "Incidental mentions of a user email in sample data without asking to change identity or auth."
examples = [
  "The user asks to fix session cookies so users stay logged in.",
  "The user asks to rotate the STRIPE_API_KEY used by billing-worker.",
]

[questions."task.risk.security".criteria.false]
what = "The request does not name auth, permissions, secrets, or identity."
not_for = "A request about OAuth scopes is security even if no secret value appears."
examples = [
  "The user asks to change the invoice PDF layout.",
  "The user asks to speed up the search index rebuild.",
]

[questions."task.verifiability.kind"]
type = "choice"
instructions.question = "How does `task.request` say the result can be checked?"
instructions.inspect = "`task.request`"
instructions.focus = "Judge only the inspect paths. The required output is `task.request` (plus `task.amendments` / `task.deliverables` when those paths are named). Do not infer the request from later episode ops or messages."

[questions."task.verifiability.kind".criteria.automated_local]
what = "The request names a local automated check such as a test command, linter, or build."
not_for = "Checks that require a human looking, a vendor system, or no check at all."
examples = [
  "The user asks to change the parser and have pytest tests/test_parser.py pass.",
  "The user asks to format the package so ruff check src exits 0.",
]

[questions."task.verifiability.kind".criteria.manual_observable]
what = "The request names something a human can observe locally without an automated suite."
not_for = "Named unit/integration tests, or checks that need production or a vendor."
examples = [
  "The user asks to tweak CSS until the button looks aligned in the browser.",
  "The user asks to play the generated audio file and confirm it is not clipped.",
]

[questions."task.verifiability.kind".criteria.external_dependent]
what = "Checking the result depends on an external system, vendor, or production data."
not_for = "Local tests or purely subjective taste with no external system involved."
examples = [
  "The user asks to confirm webhooks are delivered using the Stripe dashboard.",
  "The user asks to verify the CDN cache purged on cdn.example.com.",
]

[questions."task.verifiability.kind".criteria.subjective]
what = "The request's done condition is taste, wording, or preference with no observable check."
not_for = "Requests that name a test, screenshot, or external dashboard as the check."
examples = [
  "The user asks to make the error copy friendlier.",
  "The user asks for a nicer variable naming style in the module.",
]

[questions."task.verifiability.kind".criteria.unstated]
what = "The request does not say how anyone would know the work is done."
not_for = "Requests that name any check, even a subjective one like how copy should read."
examples = [
  "The user says improve the parser with no test, example, or check.",
  "The user says clean up billing a bit with no artefact named.",
]

[questions."task.verifiability.kind".criteria.other]
what = "The verifiability does not fit the named options, or mixes incompatible checks without a dominant kind."
not_for = "Ordinary cases that clearly match one of the named kinds."
examples = [
  "The user asks to both pass pytest and also get a legal opinion on the copy.",
  "The request is a harness-injected dump with no human request at all.",
]
