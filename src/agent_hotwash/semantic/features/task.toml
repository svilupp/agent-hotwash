# Native System One definition for task-scope features.
title = "agent-hotwash task features"

[requires]
"task.request" = "string"
"task.amendments" = "array"
"task.deliverables" = "array"
"task.status" = "string"

[data]
scope = "task"

[data.routing]
"task.intent.inquire" = ["task.intent.locate", "task.intent.explain", "task.intent.investigate", "task.intent.root_cause"]
"task.intent.change" = ["task.intent.add", "task.intent.fix", "task.intent.refactor", "task.intent.migrate_or_configure", "task.intent.remove"]
"task.intent.assess" = ["task.intent.verify", "task.intent.review", "task.intent.compare"]
"task.intent.execute" = ["task.intent.run", "task.intent.deploy"]

