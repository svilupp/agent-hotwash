# Episode reasoning demand and type Nouls (PLAN §6.3). All require reasoning_text.

[[feature]]
id = "episode.reasoning.demand"
scope = "episode"
primitive = "score"
version = 2
requires = ["reasoning_text"]
question = "How much inference does this episode's observable work demand?"
inspect = ["episode.ops", "episode.messages", "task.request"]

[feature.criteria."0_direct"]
what = "The action is a prescribed mechanical step such as a rename, format, or a named command."
not_for = "Work that needs inference from nearby code or several dependent steps."
examples = [
  "The user said run make test and the agent runs make test.",
  "The user said rename getUser to get_user in src/users.py and the agent does that rename.",
]

[feature.criteria."1_local"]
what = "The work needs one inference from nearby code or a single output."
not_for = "Prescribed mechanical actions, or several dependent inferences across artefacts."
examples = [
  "The traceback names src/a.py:12 and the agent edits that line to handle None.",
  "A test failure shows expected 2 got 3 and the agent changes the off-by-one.",
]

[feature.criteria."2_multistep"]
what = "Several dependent inferences or artefacts must be integrated in this episode."
not_for = "A single local inference, or competing system-wide hypotheses."
examples = [
  "The agent traces a value from the API handler through a proto field into the worker.",
  "The agent combines a failing test, a config flag, and a call site to land one patch.",
]

[feature.criteria."3_systemic"]
what = "The work needs competing hypotheses, cross-system synthesis, or a consequential design tradeoff."
not_for = "Local bugfixes or prescribed mechanical edits."
examples = [
  "The agent weighs consistency versus latency for a cache and records the tradeoff.",
  "The agent holds two competing causes across API and vendor webhooks and tests both.",
]

[[feature]]
id = "episode.reasoning.requires_diagnosis"
scope = "episode"
primitive = "noul"
version = 1
requires = ["reasoning_text"]
question = "Does this episode require diagnosing a cause from incomplete evidence?"

[feature.criteria.true]
what = "The work requires diagnosing a cause from incomplete evidence rather than applying a named fix."
not_for = "Applying a fix whose cause is already stated."
examples = [
  "The agent must decide why emails stopped among several plausible call sites.",
  "The agent must explain a flake that only happens on CI from partial logs.",
]

[feature.criteria.false]
what = "The work applies a prescribed fix or a local mechanical change with the cause already named."
not_for = "Diagnosis still applies when tests are used as probes rather than as the requested output."
examples = [
  "The user named the nil pointer in src/a.py:12 and the agent edits that line.",
  "The agent runs the formatter the user named.",
]

[[feature]]
id = "episode.reasoning.requires_design_tradeoff"
scope = "episode"
primitive = "noul"
version = 1
requires = ["reasoning_text"]
question = "Does this episode require choosing among consequential design options?"

[feature.criteria.true]
what = "The work requires choosing among design options with different consequences, not a single obvious edit."
not_for = "Implementing an already-chosen design, or micro-style choices."
examples = [
  "The agent must choose between a queue and a lock to prevent duplicate emails.",
  "The agent must pick a cache invalidation strategy that affects several services.",
]

[feature.criteria.false]
what = "The work has one obvious mechanical path, or the design was already chosen in the request."
not_for = "A tradeoff still applies if the agent records options even when it then implements one."
examples = [
  "The user said add the idempotency key on send_email and the agent adds it.",
  "The agent renames a local variable.",
]

[[feature]]
id = "episode.reasoning.requires_long_context_synthesis"
scope = "episode"
primitive = "noul"
version = 1
requires = ["reasoning_text"]
question = "Does this episode require combining information spread across a long preceding context?"

[feature.criteria.true]
what = "The work requires combining facts spread across a long preceding context, not a nearby snippet."
not_for = "Using a single nearby traceback or file."
examples = [
  "The agent must reconcile a constraint from the first user message with a later failing test and a third file.",
  "The agent must use an earlier subagent's findings together with the current traceback.",
]

[feature.criteria.false]
what = "The needed facts are in the immediately surrounding code or a single output."
not_for = "Synthesis still applies when the spread facts are all in the digest preceding blob."
examples = [
  "The agent edits the function whose traceback was just printed.",
  "The agent formats the file it just opened.",
]

[[feature]]
id = "episode.reasoning.requires_domain_knowledge"
scope = "episode"
primitive = "noul"
version = 1
requires = ["reasoning_text"]
question = "Does this episode require domain knowledge that is not stated in the request or nearby code?"

[feature.criteria.true]
what = "The work requires domain knowledge (protocol, vendor, or legal/ops practice) not stated in the request or nearby code."
not_for = "General programming skill or facts written in the nearby file."
examples = [
  "The agent must know Stripe idempotency-key semantics to explain a double charge.",
  "The agent must know VAT reverse-charge rules to correct the invoice tax field.",
]

[feature.criteria.false]
what = "The work only needs information stated in the request, comments, or nearby code."
not_for = "Domain knowledge still applies when the agent looks up vendor docs to fill the gap."
examples = [
  "The agent follows a comment in src/a.py that says handle None here.",
  "The user pasted the exact regex to add and the agent adds it.",
]
