[project]
name = "agent-hotwash"
version = "0.2.0"
description = "agent-hotwash — analyze coding-agent traces to surface improvement opportunities and bad patterns"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.4.2",
    "pydantic>=2",
    "rich",
    "systemoneprompts[live]>=0.1,<0.2",
    "typer",
]

[project.scripts]
agent-hotwash = "agent_hotwash.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
]
docs = [
    "mkdocs-material",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.uv]
# Pin an absolute resolution cutoff so the lockfile is reproducible across machines
# and CI. Without this, a relative `exclude-newer` from a personal uv.toml can bake
# an `exclude-newer-span` into uv.lock that CI cannot reproduce, breaking
# `uv sync --locked`.
exclude-newer = "2026-09-20T00:00:00Z"

[tool.uv.sources]
# 0.1.x is published from the sibling checkout until it is on PyPI.
systemoneprompts = { path = "../jevprompts/packages/python" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# typer's Option/Argument in parameter defaults is the framework's intended idiom.
"src/agent_hotwash/cli.py" = ["B008"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
