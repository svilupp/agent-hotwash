# ---------------------------------------------------------------------------
# Structure layer — task/episode segmentation (harness-blind).
# Delegation is classified before the injected-tag list (C3 / §5.1).
# ---------------------------------------------------------------------------
[structure]
injected_tags_user = ["<recommended_plugins>", "<environment_context>"]
delegation_tag = "<codex_delegation>"

[structure.episodes]
max_model_calls = 6
reads_before_edit_boundary = 2
idle_gap_minutes = 5.0
state_token_budget = 20000

# ---------------------------------------------------------------------------
# Semantic layer — System One / JeV client. Default is live (needs
# TYPESAFE_API_KEY). The CLI exits 1 before analysis if the key is missing.
# Cache is not compatible with the old ~/.cache/agent-hotwash/jev directory;
# `cached` mode needs one `live` warm-up. Redaction version is a subdirectory
# (`r1/`, …). `max_retries` / `timeout_s` map to TypeSafeClient.
# ---------------------------------------------------------------------------
[semantic]
mode = "live"
model = "jev-1.13.0"
cache_dir = "~/.cache/agent-hotwash/systemone"
max_questions_per_request = 15
redact = true
allow_unredacted = false
# Global live-mode budget: 1200 requests/min (20 req/s), 250k tokens/s.
requests_per_second = 20.0        # <= 0 disables client-side rate limiting
burst = 20                        # token-bucket depth
max_concurrency = 12              # concurrent in-flight requests per process
max_retries = 3                   # retries on 429 / 5xx (TypeSafeClient backoff, Retry-After honoured)
timeout_s = 20.0

# ---------------------------------------------------------------------------
# Diagnostics — cost-view knobs. Monetary diagnoses require exact pricing.
# ---------------------------------------------------------------------------
[diagnostics]
context_pressure_pct = 0.6
min_support = 20
timezone = "UTC"

# ---------------------------------------------------------------------------
# Effort-tier POLICY map (C11). Not a fact; used only for EXCESS_REASONING_TIER
# after matched evidence. Precedence: exact model+effort > model+* > glob > default.
# ---------------------------------------------------------------------------
[tiers]
version = 1
"gpt-5.6-luna:minimal" = 0
"gpt-5.6-luna:low" = 1
"gpt-5.6-luna:medium" = 2
"gpt-5.6-luna:high" = 3
"gpt-5.6-luna:xhigh" = 4
"gpt-5.6-luna:max" = 5
"gpt-5.6-sol:*" = 4
"gpt-6-astra:*" = 5
